<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
    <script>try{var s=JSON.parse(localStorage.getItem("pysinav_set")||"{}");document.documentElement.dataset.theme=s.dark===true?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Sınav Antrenörü</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--card:#fff;--ink:#2b1c20;--mut:#8a6f73;--line:#f2e4e0;--soft:#fff7f4;--soft2:#fdeee9;
--acc:#e0505c;--acc2:#f2804f;--accs:rgba(224,80,92,.09);--acct:#c93e4c;
--ok:#14895d;--okb:#e8f7f0;--bad:#c9283c;--badb:#fdecee;--warn:#d9730d;
--ed:#fffaf7;--edh:#fdf0eb;--edl:#f3e1db;--edt:#3a2a2e;--ek:#c2335a;--es:#1d8a58;--ec:#b3a0a3;--eb:#2f6bd0;--en:#d9730d;--edn:#d6c1bd;
--sh:0 1px 2px rgba(120,50,40,.04),0 18px 40px -24px rgba(200,70,60,.28);
--sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:500 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
svg{display:block;flex:none}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 56px}
header{display:flex;flex-wrap:wrap;gap:18px 24px;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:22px;font-weight:800;letter-spacing:-.025em;margin:0;display:flex;gap:14px;align-items:center;line-height:1.15}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--mut);letter-spacing:0;margin-top:3px}
.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(140deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 10px 22px -8px rgba(224,80,92,.55)}
.rank{display:flex;align-items:center;gap:12px;min-width:240px;flex:1;max-width:300px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.rank .tx{flex:1;min-width:0}
.rank .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rank b{font-weight:800;font-size:15px;letter-spacing:-.01em}.rank small{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums;font-weight:600}
.rank .sub{font-size:12px;color:var(--mut);font-weight:500}
.bar{height:7px;background:var(--soft2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:11px;box-shadow:var(--sh)}
.st .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accs);color:var(--acc)}
.st .ic.g{background:var(--okb);color:var(--ok)}.st .ic.r{background:var(--badb);color:var(--bad)}.st .ic.o{background:rgba(217,115,13,.12);color:var(--warn)}
.st b{display:flex;align-items:center;gap:5px;font-size:21px;font-weight:800;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.st b svg{color:var(--warn)}
.st span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px;margin-bottom:14px;background:var(--soft);border:1px solid var(--line);border-radius:16px}
nav button{flex:1;white-space:nowrap;border:0;background:none;color:var(--mut);padding:10px 16px;border-radius:12px;font:600 14px var(--sans);cursor:pointer;transition:background .2s,color .2s}
nav button:hover{color:var(--ink)}
nav button.on{background:linear-gradient(140deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 8px 16px -8px rgba(224,80,92,.7)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--sh)}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:5px 12px 5px 10px;border-radius:99px;margin-bottom:14px;background:var(--accs);color:var(--acct)}
.tag.math{background:rgba(217,115,13,.1);color:var(--warn)}.tag.err{background:var(--badb);color:var(--bad)}.tag.met{background:var(--okb);color:var(--ok)}
h2{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:0 0 16px;line-height:1.3}
.ed{border:1px solid var(--edl);border-radius:16px;overflow:hidden;background:var(--ed);margin-bottom:18px}
.edh{display:flex;align-items:center;gap:7px;padding:10px 14px;background:var(--edh);border-bottom:1px solid var(--edl)}
.edh i{width:10px;height:10px;border-radius:50%;background:#f3c9c1}.edh i:nth-child(2){background:#f7d9b5}.edh i:nth-child(3){background:#e9dcc0}
.edh span{margin-left:8px;font:500 12px var(--mono);color:var(--ec)}
pre{margin:0;padding:16px 18px;overflow-x:auto;font:500 14.5px/1.75 var(--mono);tab-size:4;color:var(--edt)}
.ln{display:inline-block;width:2ch;margin-right:18px;color:var(--edn);text-align:right;user-select:none}
.k{color:var(--ek);font-weight:600}.s{color:var(--es)}.c{color:var(--ec);font-style:italic}.b{color:var(--eb)}.n{color:var(--en)}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;padding:13px 16px;border:1.5px solid var(--line);background:#fff;border-radius:14px;font:600 15px var(--sans);cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--bad);background:var(--badb)}.opt:disabled{cursor:default}
.inp{display:flex;gap:10px}
input{flex:1;min-width:0;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;font:500 16px var(--mono);color:var(--ink);background:#fff}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(224,80,92,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(140deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:14px;padding:13px 24px;font:700 15px var(--sans);cursor:pointer;box-shadow:0 10px 20px -10px rgba(224,80,92,.8);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}
.ghost{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--mut);font:600 14px var(--sans);cursor:pointer;padding:12px 10px;border-radius:12px}.ghost:hover:not(:disabled){color:var(--acct);background:var(--accs)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}button[hidden]{display:none}
.hint{display:block;color:var(--mut);font-size:12.5px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}.row.end{justify-content:flex-end}
#fb{margin-top:16px}
.fb{padding:15px 18px;border-radius:14px;font-size:15px;animation:rev .3s ease}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.no{background:var(--badb);color:var(--bad)}
.fb p{margin:6px 0 0;color:var(--ink);opacity:.85;font-weight:500;white-space:pre-wrap}
.fb code{font-family:var(--mono);font-weight:700}
.ans{border:1px solid var(--line);border-left:4px solid var(--acc);background:var(--soft);border-radius:14px;padding:16px 18px;margin-bottom:16px;animation:rev .3s ease}
@keyframes rev{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.ans,.fb{animation:none}}
.ans .lb{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--acct);margin-bottom:8px}
.ans p{margin:0;color:var(--ink);font-size:16px;line-height:1.7}
.mt{font:700 32px/1.2 var(--mono);letter-spacing:-.02em;margin:2px 0 6px;word-break:break-word}
.mq{color:var(--mut);margin:0 0 20px}
.prog{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--sh)}
.prog h3{font-size:15px;font-weight:700;margin:0 0 14px}
.pr{display:grid;grid-template-columns:120px 1fr 56px;gap:12px;align-items:center;font-size:13px;font-weight:600;margin-bottom:10px}
.pr .bar{margin:0}.pr span:last-child{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.ranks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.rk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:1px solid var(--line);border-radius:14px;text-align:center;font-size:12px;font-weight:700;opacity:.5;filter:grayscale(.7)}
.rk small{font-weight:600;color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.rk.got{opacity:1;filter:none;background:var(--soft)}.rk.now{border-color:var(--acc);background:var(--soft2);box-shadow:0 0 0 3px var(--accs)}
.foot{text-align:center;margin-top:8px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.pr{grid-template-columns:96px 1fr 48px}.ranks{grid-template-columns:repeat(2,1fr)}.card{padding:18px}nav button{padding:10px 12px}.mt{font-size:26px}.rank{max-width:none}}

.ghost:disabled{opacity:.35;cursor:default}
.qh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cnt{font-size:12.5px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums;padding-top:6px}
.qnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.alt{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--soft);border:1.5px solid var(--line);color:var(--acct);border-radius:14px;padding:11px 18px;font:700 14px var(--sans);cursor:pointer;transition:border-color .15s,background .15s}
.alt:hover{border-color:var(--acc);background:var(--soft2)}.alt[hidden]{display:none}
.ans code{font-family:var(--mono);font-weight:700;font-size:16px}.ans p.ex{margin-top:8px;font-size:15px;opacity:.85}
.up{margin-top:10px;padding:8px 12px;border-radius:10px;background:#fff;border:1px dashed currentColor;font-weight:700}
@keyframes exflow{to{background-position:200% 0}}
.exw{position:relative;display:inline-grid;place-items:center;flex:none;animation:exglow 2.6s ease-in-out infinite}
.exw::before{content:"";position:absolute;inset:-22%;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,205,80,0) 0%,rgba(255,205,80,.7) 12%,rgba(255,205,80,0) 25%,rgba(255,90,170,0) 50%,rgba(255,90,170,.6) 62%,rgba(255,90,170,0) 75%,rgba(255,205,80,0) 100%);filter:blur(7px);animation:exspin 5s linear infinite}
.exw svg{position:relative;z-index:1;overflow:visible}
@keyframes exspin{to{transform:rotate(360deg)}}
@keyframes exglow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,200,70,.85))}50%{filter:drop-shadow(0 0 11px rgba(255,90,170,.9))}}
.exsp{transform-box:fill-box;transform-origin:center;animation:extw 2s ease-in-out infinite}
@keyframes extw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
.exs{animation:exsh 3s ease-in-out infinite}
@keyframes exsh{0%,35%{transform:translateX(0) skewX(-18deg);opacity:0}45%{opacity:1}75%{transform:translateX(70px) skewX(-18deg);opacity:1}100%{transform:translateX(70px) skewX(-18deg);opacity:0}}
.rank.ex{background:linear-gradient(120deg,#1b0b2e,#3a0f4d 50%,#1b0b2e);background-size:200% 100%;border-color:#f5c451;box-shadow:0 0 0 1px rgba(245,196,81,.5),0 10px 30px -8px rgba(240,80,160,.6)}
.rank.ex b{background:linear-gradient(90deg,#ffe29a,#fff,#ffb347,#ff6ec7,#ffe29a);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:exflow 3s linear infinite}
.rank.ex small,.rank.ex .sub{color:#e2cdf7}
.rank.ex .bar{background:rgba(255,255,255,.18)}
.rank.ex .bar i{background:linear-gradient(90deg,#ffd66b,#ff6ec7,#ffd66b);background-size:200% 100%;animation:exflow 2s linear infinite}
.rk.ex{grid-column:1/-1;flex-direction:row;justify-content:center;gap:16px;padding:16px;font-size:14px;letter-spacing:.04em}
.rk.ex .exn{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.rk.ex.got{background:linear-gradient(120deg,#1b0b2e,#3a0f4d 50%,#1b0b2e);border-color:#f5c451;color:#fff;box-shadow:0 0 0 3px rgba(245,196,81,.2),0 14px 34px -14px rgba(240,80,160,.7)}
.rk.ex.got small{color:#e2cdf7}
.rk.ex.got .exn b{background:linear-gradient(90deg,#ffe29a,#fff,#ffb347,#ff6ec7,#ffe29a);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:exflow 3s linear infinite;font-size:17px;letter-spacing:.12em}
.rk:not(.got) .exw,.rk:not(.got) .exw::before,.rk:not(.got) .exs,.rk:not(.got) .exsp{animation:none}
.rk:not(.got) .exw::before{display:none}
.cele{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3a0f4d,#0a0412 70%);animation:cin .5s ease;padding:20px}
@keyframes cin{from{opacity:0}to{opacity:1}}
.cele i{position:absolute;bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;background:#ffd66b;box-shadow:0 0 10px 2px rgba(255,190,70,.8);animation:rise var(--d) linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}10%{opacity:1}to{transform:translateY(-110vh);opacity:0}}
.cc{position:relative;text-align:center;color:#fff;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px}
.cbd{margin:22px 0 14px}
.cap{font-size:13px;font-weight:700;letter-spacing:.3em;color:#e2cdf7}
.ct{font:800 clamp(30px,8vw,52px)/1.1 var(--sans);letter-spacing:.12em;background:linear-gradient(90deg,#ffe29a,#fff,#ffb347,#ff6ec7,#ffe29a);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:exflow 3s linear infinite}
.cs{margin:0 0 12px;color:#e2cdf7;font-size:15px}
@media(max-width:560px){.qnav .rv{order:3;flex:1 0 100%}}
@media(prefers-reduced-motion:reduce){.exw,.exw::before,.exs,.exsp,.rank.ex b,.rank.ex .bar i,.rk.ex.got .exn b,.ct,.cele,.cele i{animation:none!important}}

.me{display:flex;align-items:center;gap:10px;flex-basis:100%;justify-content:flex-end;font-weight:700;font-size:14px;order:-1}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;display:grid;place-items:center;flex:none;background:var(--soft2);color:var(--acct);font-weight:800}
.me .pick{cursor:pointer;border-radius:50%}.me .ghost{padding:6px 10px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pick:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.gate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(43,28,32,.55);overflow:auto}
.gate[hidden]{display:none}
.gate form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.gate h2{margin:0}.gate input{width:100%;flex:none;font-family:var(--sans)}
.gate .err{color:var(--bad);font-size:13.5px;font-weight:600;min-height:1.4em;margin:0}
.lr{display:grid;grid-template-columns:34px 36px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.lr.mine{border-color:var(--acc);background:var(--soft2)}
.lr .no{font-weight:800;text-align:center;color:var(--mut);font-variant-numeric:tabular-nums}
.lr b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lr small{color:var(--mut);font-size:12px;display:block}
.lr .xp{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}

/* ---- v4 ---- */
[hidden]{display:none!important}
.pav{position:relative;border:0;background:none;padding:0;cursor:pointer;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--acc);flex:none}
.pav.g{cursor:default;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--line)}
.pav .av{width:52px;height:52px;font-size:20px}
.pav .cam{position:absolute;right:-5px;bottom:-5px;width:24px;height:24px;border-radius:50%;background:linear-gradient(140deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;border:2px solid #fff}
.pin{display:flex;flex-direction:column;align-items:flex-start;gap:4px;line-height:1.2;min-width:0}.pin small{color:var(--mut);font-size:12px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);color:var(--acct);border-radius:99px;padding:4px 11px;font:700 12px var(--sans);cursor:pointer}
.pill:hover{border-color:var(--acc);background:var(--soft2)}.btn.sm{padding:9px 18px;font-size:14px}
.pmc{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}.pmc h2{margin:0}
.drop{display:grid;place-items:center;gap:4px;text-align:center;padding:30px 16px;border:2px dashed var(--line);border-radius:18px;background:var(--soft);cursor:pointer;transition:.2s}
.drop:hover,.drop.on{border-color:var(--acc);background:var(--soft2)}.drop:focus-within{outline:2px solid var(--acc)}.drop small{color:var(--mut)}
.dic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--acc),var(--acc2));color:#fff;margin-bottom:6px}
.crop{display:flex;flex-direction:column;align-items:center;gap:12px}
.crop canvas{width:240px;height:240px;max-width:100%;border-radius:18px;touch-action:none;cursor:grab;box-shadow:var(--sh)}
.crop input{padding:0;border:0;height:24px;accent-color:var(--acc);background:none}
.lb .lr,.lr.p1,.lr.p2,.lr.p3{grid-template-columns:30px 36px 1fr auto auto}
#lbp .lr .no{width:28px;height:28px;line-height:28px;border-radius:50%}
.lr.p1{background:linear-gradient(120deg,#fff4cf,#ffe39a);border-color:#e9b949}.lr.p1 .no{background:#e9b949;color:#fff}
.lr.p2{background:linear-gradient(120deg,#f4f6f9,#e3e8ee);border-color:#aeb9c6}.lr.p2 .no{background:#8d9bab;color:#fff}
.lr.p3{background:linear-gradient(120deg,#fdeede,#f6d3b5);border-color:#d99a66}.lr.p3 .no{background:#c9824a;color:#fff}
.lr.p1 small,.lr.p2 small,.lr.p3 small{color:#6b5a4a}
.gapl{text-align:center;color:var(--mut);letter-spacing:.3em;margin:-2px 0 6px}
.lr.act{grid-template-columns:10px 36px 1fr auto auto}
.dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
.vsb{padding:8px 14px;font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-size:12px;font-weight:700;color:var(--ok);background:var(--okb);padding:3px 10px;border-radius:99px}
.live i{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.3}}
.inv{position:fixed;z-index:60;left:50%;top:max(12px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:calc(100% - 24px);max-width:520px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:20px;box-shadow:0 20px 50px -12px rgba(0,0,0,.45)}
.inv>div:not(.tb){flex:1;min-width:150px;line-height:1.3}.inv small{display:block;color:var(--mut);font-size:12px}.inv .tb{flex:1 0 100%;margin:0}
.tb{height:5px;background:var(--soft2);border-radius:9px;overflow:hidden;margin:0 0 14px}
.tb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));animation:tmr 20s linear forwards}@keyframes tmr{from{width:100%}to{width:0}}
.vs{position:fixed;inset:0;z-index:45;overflow:auto;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 50% 0,#3a0f4d,#0a0412 75%)}
.vsc{width:100%;max-width:640px}
.vh2{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:16px}
.pl{display:flex;align-items:center;gap:8px;min-width:0}.pl.r{flex-direction:row-reverse;text-align:right}.pl .t{min-width:0}
.pl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.pl small{display:block;color:var(--mut);font-size:11px}
.scr{font:800 28px var(--mono);color:var(--acct)}
.vsx{font:800 22px var(--sans);letter-spacing:.1em;background:linear-gradient(140deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.cnt3{font:800 84px/1 var(--mono);text-align:center;color:var(--acct);padding:36px 0 10px}
.gapb{padding:22px;border-radius:16px;text-align:center;background:var(--soft)}.gapb.ok{background:var(--okb);color:var(--ok)}.gapb.no{background:var(--badb);color:var(--bad)}
.gapb b{font-size:20px}.gapb p{color:var(--ink);margin:8px 0 0;font-weight:500}
.fin{text-align:center;padding:14px 0}.fin .ft{font:800 34px var(--sans);color:var(--mut)}.fin.win .ft{color:var(--ok)}.fin.lose .ft{color:var(--bad)}
.fin .fs{font:800 54px var(--mono);margin:6px 0}
/* ===== KARANLIK MOD ===== */
[data-theme="dark"]{color-scheme:dark;
    --bg:#14100f;--card:#1e1817;--ink:#f3e9e6;--mut:#a89592;--line:#33292a;--soft:#251d1d;--soft2:#2f2424;
    --acc:#ef6471;--acc2:#f58d5f;--accs:rgba(239,100,113,.14);--acct:#ff8a94;
    --ok:#3ecf94;--okb:rgba(62,207,148,.13);--bad:#ff6b7d;--badb:rgba(255,107,125,.14);--warn:#f5a04a;
    --ed:#191413;--edh:#241c1b;--edl:#352a29;--edt:#f1e6e3;--ek:#ff7aa2;--es:#5fd39b;--ec:#8f7c7a;--eb:#6ea8ff;--en:#f5a04a;--edn:#5a4a49;
    --sh:0 1px 2px rgba(0,0,0,.4),0 18px 40px -24px rgba(0,0,0,.7)}
[data-theme="dark"] .opt:not(.ok):not(.no){background:var(--soft)}
[data-theme="dark"] .opt:not(.ok):not(.no):hover:not(:disabled){background:var(--soft2)}
[data-theme="dark"] input,[data-theme="dark"] .up{background:var(--soft)}
[data-theme="dark"] .pav{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
[data-theme="dark"] .pav.g{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--line)}
[data-theme="dark"] .pav .cam{border-color:var(--card)}
[data-theme="dark"] .lr.p1{background:linear-gradient(120deg,#4b3a10,#6a5018)}
[data-theme="dark"] .lr.p2{background:linear-gradient(120deg,#2e3338,#444c55)}
[data-theme="dark"] .lr.p3{background:linear-gradient(120deg,#4a2e1a,#6a4128)}
[data-theme="dark"] .lr.p1 small,[data-theme="dark"] .lr.p2 small,[data-theme="dark"] .lr.p3 small{color:#d9c9b0}
.card,.st,.rank,.prog,nav,.ed,.lr,input{transition:background-color .3s,border-color .3s,color .3s}

/* ===== AYAR PANELİ ===== */
.gear{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--acct);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh);transition:transform .25s}
.gear:hover{transform:rotate(30deg) scale(1.07)}
.setp{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:36;width:min(300px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:0 20px 50px -12px rgba(0,0,0,.35);animation:rev .2s ease}
.setp h3{margin:0 0 6px;font-size:15px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer}
.setp h3+.srow{border-top:0}
.setp input.sw{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:26px;padding:0;border:0;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.setp input.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.setp input.sw:checked{background:linear-gradient(140deg,var(--acc),var(--acc2))}
.setp input.sw:checked::after{transform:translateX(20px)}
.setp input[type=range]{flex:1;padding:0;border:0;height:24px;background:none;accent-color:var(--acc)}
.setp input[type=range]:disabled{opacity:.35}

/* ===== ANİMASYONLAR ===== */
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes cntpop{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}85%{opacity:1}100%{transform:scale(.85);opacity:.4}}
@keyframes xpf{0%{transform:translate(-50%,0);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-80px);opacity:0}}
#card h2,#card .ed,#card .opt{animation:rev .35s ease both}
#card .opt.ok{animation:pop .45s ease}
#card .opt.no,.fb.no{animation:shake .4s ease}
.btn:active,.alt:active{transform:scale(.96)}
.opt:active:not(:disabled){transform:scale(.98)}
.cnt3{animation:cntpop .9s ease}
.xpf{position:fixed;left:50%;top:38%;z-index:70;pointer-events:none;font:800 28px var(--sans);color:var(--ok);text-shadow:0 2px 12px rgba(0,0,0,.25);animation:xpf 1.1s ease-out forwards}
body.noanim *:not(i),body.noanim *:not(i)::before,body.noanim *:not(i)::after{animation:none!important;transition:none!important}
body.noanim .cele i,body.noanim .live i{animation:none!important}
.opr{color:#0f8a8a;font-weight:700}
[data-theme="dark"] .opr{color:#4fd1d1}
.tbtn{right:calc(max(16px,env(safe-area-inset-right,0px)) + var(--o))}
.tbtn:hover{transform:scale(1.07)}
/* ===== HEADER: rütbe solda, profil sağda ===== */
header{gap:14px 16px}
header .rank{order:1;flex:1 1 280px;max-width:340px;min-width:0}
header .me{order:2;flex:1 1 auto;justify-content:flex-end;min-width:0}
header h1{order:3;flex:1 0 100%}
.me .hint{flex:1 0 100%;text-align:right}

/* ===== RANGE (kaydırıcı) TASARIMI ===== */
input[type=range]{-webkit-appearance:none;appearance:none;--p:0%;height:24px;padding:0;border:0;border-radius:0;background:transparent;cursor:pointer;box-shadow:none}
input[type=range]:focus{box-shadow:none;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2)) left/var(--p) 100% no-repeat,var(--soft2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:22px;height:22px;margin-top:-7px;border-radius:50%;background:var(--card);border:3px solid var(--acc);box-shadow:0 3px 10px -2px rgba(224,80,92,.55);transition:transform .15s}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--soft2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
input[type=range]::-moz-range-thumb{box-sizing:border-box;width:22px;height:22px;border-radius:50%;background:var(--card);border:3px solid var(--acc);box-shadow:0 3px 10px -2px rgba(224,80,92,.55)}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--accs)}
input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 4px var(--accs)}

/* ===== VS ekranı: küçük ekranda üstten taşmasın ===== */
body{min-height:100dvh}
.wrap{padding-bottom:96px}
.vs,.gate{display:flex;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.vs>.vsc,.gate>form,.gate>.pmc{margin:auto}

/* ===== MOBİL ===== */
@media(max-width:560px){
    .wrap{padding:14px 12px 96px}
    header .rank{flex:1 1 100%;max-width:none}
    header .me{flex:1 1 100%;justify-content:space-between}
    header .me .pin{flex:1}
    h1{font-size:19px}.logo{width:40px;height:40px}
    .st{padding:10px 11px;gap:9px}.st b{font-size:18px}.st .ic{width:30px;height:30px}
    h2{font-size:18px}
    pre{font-size:13px;padding:12px 14px}.ln{margin-right:12px}
    .opt{padding:12px 14px;font-size:14.5px}
    .inp{flex-direction:column}.inp .btn{width:100%}
    .prog{padding:16px}
    .lr,.lb .lr,.lr.p1,.lr.p2,.lr.p3{grid-template-columns:26px 34px 1fr auto;gap:8px;padding:8px}
    .lr.act{grid-template-columns:10px 34px 1fr auto}
    .lr>svg,.lr>.exw{display:none}
    .inv{padding:12px}
    /* VS */
    .vsc.card{padding:14px;border-radius:20px}
    .vh2{gap:6px;margin-bottom:12px}
    .pl{gap:6px}.pl .av{width:30px;height:30px;font-size:13px}
    .pl b{font-size:13px}.pl small{display:none}
    .scr{font-size:22px}.vsx{font-size:16px}
    .vs h2{font-size:17px}
    .vs .opt{padding:11px 12px;font-size:14px}
    .cnt3{font-size:68px;padding:24px 0 6px}
    .fin .ft{font-size:28px}.fin .fs{font-size:44px}
    .gapb{padding:16px}
    .gear{width:44px;height:44px}
    .tbtn{right:calc(max(16px,env(safe-area-inset-right,0px)) + var(--o)*.9)}
}
.stats>*{min-width:0}
.st>div:last-child{min-width:0}
header>*{min-width:0}
/* Kod yazısında ligatür kapalı: >= <= == != ayrı görünsün */
pre,pre *,code,input,.mt,.ln{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}

let AC=null;
function tone(f,t=0,d=.12,type="sine",v=.25,f2){
    if(!SET.sound)return;
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C()}
    if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;
    o.type=type;o.frequency.setValueAtTime(f,s);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);
    g.gain.setValueAtTime(.0001,s);
    g.gain.exponentialRampToValueAtTime(Math.max(v*SET.vol,.0002),s+.01);
    g.gain.exponentialRampToValueAtTime(.0001,s+d);
    o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+.02)}

const SND={
    click:()=>tone(520,0,.05,"triangle",.18),
    tab:()=>tone(660,0,.06,"triangle",.18),
    ok:(n=0)=>{const b=523*Math.pow(2,Math.min(n,7)/12);tone(b,0,.12,"sine",.3);tone(b*1.25,.09,.12,"sine",.3);tone(b*1.5,.18,.2,"sine",.3)},
    no:()=>{tone(220,0,.18,"sawtooth",.2,150);tone(160,.14,.25,"sawtooth",.2,100)},
    up:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.22,"square",.2)),
    fan:()=>{[392,494,587,784].forEach((f,i)=>tone(f,i*.13,.3,"triangle",.3));[784,988,1175,1568].forEach((f,i)=>tone(f,.6+i*.11,.4,"sine",.28))},
    tick:n=>tone(n===1?880:660,0,.14,"sine",.35),
    go:()=>{tone(988,0,.1,"square",.2);tone(1319,.1,.3,"square",.2)},
    win:()=>SND.fan(),
    lose:()=>[330,277,233,196].forEach((f,i)=>tone(f,i*.16,.28,"triangle",.28)),
    inv:()=>{tone(784,0,.12,"sine",.3);tone(988,.14,.12,"sine",.3);tone(784,.4,.12,"sine",.3);tone(988,.54,.16,"sine",.3)}

new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){
    if(n.nodeType!==1)continue;
    const q=s=>n.matches(s)?n:n.querySelector(s);let e;
    if(e=q(".cnt3"))snd("tick",+e.textContent);
    else if(q(".gapb.ok"))snd("ok",3);
    else if(q(".gapb.no"))snd("no");
    else if(q(".fin.win"))snd("win");
    else if(q(".fin.lose"))snd("lose");
    else if((e=q(".inv"))&&e.textContent.includes("çağırdı"))snd("inv");
    else if((q(".opt")||q("#vin"))&&n.closest&&n.closest(".vs")&&ar&&ar.qi===0&&!ar.goSnd){ar.goSnd=1;snd("go")}
}}).observe(document.body,{childList:true,subtree:true});
